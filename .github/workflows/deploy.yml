name: Deploy SpaceGuard para Azure

# Dispara automaticamente a cada push na branch main (e tambem permite
# rodar manualmente pelo botao "Run workflow" na aba Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: spaceguard-rm
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias e buildar o front
        run: |
          npm install
          npm run build

      - name: Montar pacote de producao (server + front buildado + deps)
        run: |
          npm prune --production
          mkdir deploy
          cp -r server.js package.json package-lock.json public node_modules deploy/

      - name: Diagnostico - a secret esta chegando?
        env:
          CRED: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$CRED" ]; then
            echo "::error::SECRET AZURE_CREDENTIALS VAZIA OU NAO ENCONTRADA"
          else
            echo "Secret presente: ${#CRED} caracteres"
            echo "Comeca com: $(echo "$CRED" | head -c 1)"
          fi

      - name: Login no Azure (credencial segura via secret)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy
